# cn-printer ./test override — the same stack with VIRTUAL devices and no
# homelab dependencies (no tailnet, no host avahi, no kaiser, no S3):
#   * ts-printer becomes a plain netns holder (alpine sleep); ports move to
#     127.0.0.1:1xxxx so a Mac's own cupsd on :631 never collides
#   * ippeve: ippeveprinter stands in for the Brother at ipp://localhost:8631
#   * the SANE `test` backend stands in for the scanner (test:0)
#   * traefik-lan joins the netns, plain HTTP on :18081, no step-ca
#   * the Google Drive remote is an rclone `local` remote → ./.test/drive-out
#   * ews: busybox httpd serving a captured Brother maintenance page on :8632
#     (what cups-exporter scrapes through ipp-usb on the real host)
#   * production-only services move behind the `prod` profile
# Used by ./test: docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.test
services:
  ts-printer:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    cap_add: !reset []
    devices: !reset []
    volumes: !reset []
    environment: !reset []
    # Loopback ports come from .env.test (TEST_*_PORT) and can be overridden in
    # the shell (`TEST_SCAN_PORT=28080 ./test`) when something else on the
    # machine already owns one of them.
    ports: !override
      - "127.0.0.1:${TEST_CUPS_PORT:-16310}:631"    # cups
      - "127.0.0.1:${TEST_SCAN_PORT:-18080}:8080"   # scanservjs
      - "127.0.0.1:${TEST_EXP_PORT:-19329}:9329"    # cups-exporter (joins the netns in test)
      - "127.0.0.1:${TEST_EDGE_PORT:-18081}:18081"  # traefik-lan (joins the netns in test; plain HTTP)

  ippeve:
    image: cn-printer-ippeve:test
    build:
      context: ./cups
      dockerfile: Dockerfile.ippeve
    network_mode: "service:ts-printer"
    depends_on: [ts-printer]
    # -r off: no DNS-SD; -k keep spool files; -f mimics what the Brother
    # advertises (PDF included — proves the queue still sends raster).
    command: ["-v", "-p", "8631", "-d", "/spool", "-k", "-r", "off", "-n", "localhost",
              "-f", "application/pdf,image/pwg-raster,image/urf,image/jpeg",
              "-M", "Brother", "-m", "MFC-L2750DW series", "Virtual Brother"]
    volumes:
      - ippeve_spool:/spool
    healthcheck:
      disable: true
    restart: "no"

  cups:
    depends_on: [ts-printer, ippeve]
    environment:
      - CUPS_BROWSING=Off
      - PRINTER_WAIT_SECONDS=90
      - PRINTER_ADVERTISE_HOST=localhost
    volumes: !override
      - cups_etc:/etc/cups
      - ${CUPS_LOG_DIR}:/var/log/cups
      - avahi_services:/etc/avahi/services   # stand-in for the host dir; the record is still written

  scanservjs:
    volumes: !override
      - ./.test/airscan.conf:/etc/sane.d/airscan.conf:ro
      - ./sane/dll.conf:/etc/sane.d/dll.conf:ro
      - ./sane/test.conf:/etc/sane.d/test.conf:ro
      - ./scanservjs/config.local.js:/etc/scanservjs/config.local.js:ro
      - ./.test/rclone:/etc/rclone                 # [gdrive] type = local (written by ./test)
      - ./.test/drive-out:/drive-out               # where the stand-in "Drive" lands
      - scanservjs_data:/var/lib/scanservjs
      - ${SCANS_DIR}:/var/lib/scanservjs/output

  traefik-lan:
    network_mode: "service:ts-printer"
    depends_on: [ts-printer]
    command: !override
      - "--entrypoints.web.address=:18081"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=INFO"
    environment: !reset []
    extra_hosts: !reset []
    volumes: !override
      - ./traefik-lan/dynamic.test.yml:/etc/traefik/dynamic.yml:ro

  # Stand-in for the Brother's embedded web server: the real one is proxied by
  # ipp-usb at http://172.30.6.1:60000/; here busybox serves the fixture page
  # (serial scrubbed) so the maintenance-page metrics are exercised end to end.
  ews:
    image: busybox:1.36          # alpine's busybox build has no httpd applet
    network_mode: "service:ts-printer"
    depends_on: [ts-printer]
    command: ["httpd", "-f", "-p", "8632", "-h", "/www"]
    volumes:
      - ./cups-exporter/tests/fixtures/ews:/www:ro
    restart: "no"

  cups-exporter:
    network_mode: "service:ts-printer"
    depends_on: [ts-printer, cups, ews]
    environment:
      - CUPS_SERVER=localhost:631
      - PRINTER_IPP_URI=ipp://localhost:8631/ipp/print
      - PRINTER_EWS_URL=http://localhost:8632
      - PRINTER_EWS_INTERVAL=5
      - EXPORTER_PORT=9329

  # Stand-in for Paperless-ngx (forwarder/tests/fake_paperless.py): accepts the
  # multipart upload, answers the task poll, keeps the files in .test/paperless-out.
  # reject-me.pdf ends in FAILURE so the failed/ path is exercised too.
  fake-paperless:
    image: python:3.12-alpine
    command: ["python3", "-u", "/srv/fake_paperless.py"]
    environment:
      - PORT=8000
      - OUT_DIR=/out
      - FAKE_TOKEN=test-token
      - FAIL_NAMES=reject-me.pdf
    volumes:
      - ./forwarder/tests/fake_paperless.py:/srv/fake_paperless.py:ro
      - ./.test/paperless-out:/out
    ports:
      - "127.0.0.1:${TEST_PAPERLESS_PORT:-18000}:8000"
    restart: "no"

  paperless-forwarder:
    depends_on: [fake-paperless]
    environment:
      - PAPERLESS_URL=http://fake-paperless:8000
      - PAPERLESS_TOKEN=test-token
      - PAPERLESS_TAGS=scanned
      - PROCESSED_RETENTION_DAYS=30
      - POLL_SECONDS=2
      - STABILITY_SECONDS=1
      - TASK_POLL_SECONDS=1
      - CA_BUNDLE=                 # plain HTTP to the fake; no step-ca root in test
    volumes: !override
      - ./.test/scans:/scans
      - ./.test/textfile:/textfile

  node-exporter-lan:
    profiles: ["prod"]
  promtail-lan:
    profiles: ["prod"]
  watchtower:
    profiles: ["prod"]
  backup:
    profiles: ["prod"]

volumes:
  ippeve_spool:
  avahi_services:
